[platformio]
default_envs = stackchan_k151

[env:stackchan_k151]
; Arduino-ESP32 3.3.7, as required by the official M5Stack documentation.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/toolchain_path.py
lib_ldf_mode = chain+
lib_compat_mode = strict
; These packages come from the BSP manifest but are not used by this application.
; Keep their revisions pinned below, but do not link unused code into the firmware.
lib_ignore =
    IRremoteESP8266
    M5Unit-NFC
    M5UnitUnified
    M5HAL
    M5Utility
build_flags =
    -Wall
    -Wextra
    -Wshadow
lib_deps =
    https://github.com/m5stack/M5GFX.git#03565ccc96cb0b73c8b157f5ec3fbde439b034ad
    https://github.com/m5stack/M5Unified.git#28c6a1f03d05f3ff3216adc89b09c9328448ad53
    https://github.com/m5stack/M5Utility.git#301a6b5c6413875e1dd80b027e0639921972b433
    https://github.com/m5stack/M5HAL.git#0f06f9d3134706ce030fd5515601cce65a267233
    https://github.com/m5stack/M5UnitUnified.git#bf711f370047cf16355b00005450ef615fab36e2
    https://github.com/m5stack/M5Unit-NFC.git#93745b547364f310cd64b5155a870103a7800a5d
    https://github.com/crankyoldgit/IRremoteESP8266.git#8833210f93073b8f732130cf935e18693f93641b
    https://github.com/m5stack/StackChan-BSP.git#f7ed40e6f5d9a1d08440cb926f3a0865b81882f8

[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
test_build_src = yes
build_src_filter =
    +<AudioDirectionEstimator.cpp>
    +<EndNodPlanner.cpp>
    +<ListenerStateMachine.cpp>
    +<HeadPetController.cpp>
    +<HeadPetGestureDetector.cpp>
    +<HeadTouchAudioGuard.cpp>
    -<main.cpp>
    -<AudioDetector.cpp>
    -<MotionController.cpp>
    -<FaceRenderer.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -Wshadow
