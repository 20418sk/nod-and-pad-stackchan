[platformio]
default_envs = stackchan_k151_face_diag
src_dir = experiments/face_idf/main
build_dir = .pio/face-idf-build

[env:stackchan_k151_face_diag]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-cores3
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = experiments/face_idf/partitions.csv
board_build.sdkconfig_defaults = experiments/face_idf/sdkconfig.defaults
extra_scripts =
    pre:scripts/register_face_upload.py
    post:scripts/pack_face_models.py
build_flags =
    -Wall
    -Wextra
